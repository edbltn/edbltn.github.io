  new Image().src = P2; // preload

  const stage = document.getElementById('stage');
  const panel = document.getElementById('panel');
  const ringWrap = document.getElementById('ring-wrap');
  const ring = document.getElementById('ring');
  const hint = document.getElementById('hint');
  const CIRC = 106.8, DURATION = 20000;

  // star location as a fraction of the source image (measured from pixels)
  const STAR = { fx: 0.49983, fy: 0.49566 }, IMG_W = 1254, IMG_H = 1254;
  function placeRing() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.max(vw / IMG_W, vh / IMG_H);      // object-fit: cover scale
    const rw = IMG_W * s, rh = IMG_H * s;            // rendered size
    const ox = (vw - rw) / 2, oy = (vh - rh) / 2;    // crop offsets
    ringWrap.style.left = (ox + STAR.fx * rw) + 'px';
    ringWrap.style.top  = (oy + STAR.fy * rh) + 'px';
  }
  placeRing();
  window.addEventListener('resize', placeRing);
  window.addEventListener('orientationchange', placeRing);
  let timers = [], running = false;
  const clear = () => { timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = []; };

  function begin() {
    clear(); running = true;
    panel.src = P1;
    hint.classList.remove('on');
    ringWrap.classList.add('on');
    ring.style.strokeDashoffset = CIRC;

    const t0 = performance.now();
    const tick = setInterval(() => {
      const p = Math.min((performance.now() - t0) / DURATION, 1);
      ring.style.strokeDashoffset = CIRC * (1 - p);
      if (p >= 1) clearInterval(tick);
    }, 50);
    timers.push(tick);

    timers.push(setTimeout(() => {
      panel.src = P2;
      ringWrap.classList.remove('on');
      timers.push(setTimeout(() => {
        hint.textContent = 'tap to burn again';
        hint.classList.add('on');
        running = false;
      }, 15000));
    }, DURATION));
  }

  stage.addEventListener('click', () => {
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    if (!running) begin();
  });
</script>
